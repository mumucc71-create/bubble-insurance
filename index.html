<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e3ecf3"><title>버블보험</title><link rel="stylesheet" href="style.css"></head><body><main class="phone"><header class="hero"><div class="brandrow"><span class="brand">버블보험</span><button aria-label="알림" data-notice><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button></div><div class="herobody"><div><h1>고객과의 연결,<br>더 간편하게</h1><p aria-hidden="true" style="visibility:hidden">&#160;</p></div><img class="mascot" src="assets/bubble.png" alt="버블이"></div><svg class="wave" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40C120-20 280 98 600 0V60H0Z" fill="white"/></svg></header><section class="content"><div class="heroactions"><button class="primary" id="add">＋ 고객 등록</button><button class="secondary" id="inviteMain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11c0 5-4 7-9 7H8l-5 4v-7C0 5 7 3 12 3s9 3 9 8Z"/></svg>고객 초대</button></div><div class="sectiontitle"><h2>내 고객</h2><button id="searchToggle" aria-label="고객 검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg></button></div><label class="search" hidden><input id="search" placeholder="고객 이름 검색" aria-label="고객 이름 검색"></label><div class="filters" id="filters"><button data-filter="all" class="selected">전체 0</button><button data-filter="대기">대기 0</button><button data-filter="완료">완료 0</button></div><div id="clientList"></div><button class="ask" id="ask"><img src="assets/bubble.png" alt=""><b>버블이에게 물어보기</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button></section><nav class="bottomnav"><button data-bottom="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3Z"/></svg><span>홈</span></button><button data-bottom="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="7" r="4"/><path d="M2 22v-3a8 8 0 0 1 16 0v3ZM17 3a4 4 0 0 1 0 8M20 14c3 1 3 5 3 8"/></svg><span>고객</span></button><button data-bottom="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11c0 5-4 7-9 7H8l-5 4v-7C0 5 7 3 12 3s9 3 9 8Z"/></svg><span>상담</span></button><button data-bottom="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3 1-2h4l1 3 3 1 3-1 2 4-2 2v4l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-4L1 8l2-4 3 1Z"/><circle cx="12" cy="12" r="4"/></svg><span>설정</span></button></nav></main><p class="sample">디자인 시안 · 예시 데이터</p><dialog id="modal"><form id="customerForm"><div class="modalhead"><h2>새 고객 등록</h2><button type="button" class="close" data-close>×</button></div><label>고객 이름<input name="name" required maxlength="30" placeholder="예: 김고객"></label><label>연락처<input name="phone" required inputmode="tel" placeholder="010-0000-0000"></label><label>상담 메모<textarea name="memo" maxlength="300" placeholder="상담 일정 등 간단한 메모"></textarea></label><button class="primary" type="submit">고객 등록하기</button></form></dialog>
<dialog id="inviteModal"><div class="modalhead"><h2>고객 초대</h2><button class="close" data-close>×</button></div><p id="inviteName"></p><div class="notice">카카오 발송·본인인증 연동 준비 중</div><p>실제 발송 없이 초대 문구를 미리 확인할 수 있어요.</p><textarea id="inviteText" readonly rows="6"></textarea><button class="primary" id="copy">초대 문구 복사</button><p class="localnote">인증 링크는 연동 후 자동으로 포함됩니다.</p></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
