<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e3ecf3"><title>버블보험 · 고객</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#0d2c4d;font-family:Arial,"Noto Sans KR",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}button,input{font:inherit}button{color:inherit;cursor:pointer;background:none;border:0}button:focus-visible,input:focus-visible{outline:3px solid #86a6c4;outline-offset:3px}svg{width:28px;height:28px;flex-shrink:0}.phone{max-width:430px;margin:20px auto 0;border:1px solid #d1d5d9;border-radius:38px;overflow:hidden;container-type:inline-size;min-height:calc(100dvh - 102px)}header{height:174px;position:relative;background:#e3ecf3;padding:28px 28px 0}.brand{font-size:32px;font-weight:1000;letter-spacing:-1.5px}header p{font-size:19px;margin:5px 0 0;letter-spacing:-.6px}header img{position:absolute;width:45cqw;height:auto;right:8px;top:0;z-index:1}.wave{position:absolute;left:0;bottom:-1px;width:100%;height:45px}.content{padding:12px 20px 28px}h1{text-align:center;font-size:32px;letter-spacing:-1.2px;margin:13px 0 21px;font-weight:900}.budget{border:1px solid #d3d6dc;border-radius:16px;padding:16px 20px 17px;color:#14273b}.budget label{font-size:18px;font-weight:650}.amount{display:block;font-size:35px;line-height:1.45;font-weight:800;letter-spacing:-1px}.hint{font-size:16px;margin:3px 0 16px}.range{appearance:none;width:100%;height:10px;border-radius:10px;display:block;margin:0;background:linear-gradient(to right,#0d2c4d 25.93%,#e0e5eb 25.93%)}.range::-webkit-slider-thumb{appearance:none;width:23px;height:23px;border:2px solid #0d2c4d;background:white;border-radius:50%;box-shadow:0 2px 4px #0d2c4d33}.range::-moz-range-thumb{width:20px;height:20px;border:2px solid #0d2c4d;background:white;border-radius:50%}.limits{display:flex;justify-content:space-between;font-size:17px;margin-top:12px}.primary{width:100%;height:58px;border-radius:12px;background:#0d2c4d;color:white;font-weight:750;font-size:24px;margin:24px 0 14px;letter-spacing:-.6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secondary{height:57px;display:flex;gap:10px;align-items:center;justify-content:center;border:1.4px solid #0d2c4d;border-radius:12px;font-weight:700;font-size:20px;white-space:nowrap}.link-record{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #d3d6dc;border-radius:13px;padding:13px 18px;margin-top:23px}.link-record>svg:first-child{width:35px;height:35px}.link-record span{flex:1}.link-record b{display:block;font-size:22px;letter-spacing:-.6px}.link-record small{display:block;font-size:17px;color:#1d2d3d;margin-top:2px}.link-record>svg:last-child{width:20px}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:white;border-top:1px solid #dfe2e5;display:grid;grid-template-columns:repeat(4,1fr);height:calc(82px + env(safe-area-inset-bottom,0px));padding:13px 12px calc(16px + env(safe-area-inset-bottom,0px));z-index:20}.bottomnav button{display:flex;align-items:center;flex-direction:column;gap:4px;font-size:15px;padding:0}.bottomnav svg{width:27px;height:27px}#toast{display:none;position:fixed;bottom:calc(94px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0d2c4d;color:white;padding:14px 20px;border-radius:12px;width:max-content;max-width:90%;font-size:14px;z-index:30;line-height:1.5}@media(max-width:450px){.phone{margin:0 auto;border:0;border-radius:0;min-height:calc(100dvh - 82px)}header{padding-left:24px;padding-right:24px}}@media(max-width:370px){header{padding-left:20px;height:160px}.brand{font-size:29px}header p{font-size:17px}h1{font-size:29px}.content{padding-left:18px;padding-right:18px}.secondary{font-size:18px;gap:7px}.link-record{padding:12px;gap:10px}.link-record b{font-size:20px}.link-record small{font-size:15px}}
</style></head><body><main class="phone"><header><div class="brand">버블보험</div><p>설계부터 청구까지</p><img src="assets/bubble.png" alt="버블이"><svg class="wave" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40C170-50 360 110 600 0V60H0Z" fill="white"/></svg></header><section class="content"><h1>내 보험을 더 쉽게</h1><div class="budget" id="budgetPanel" hidden><label for="budget">월 보험료 예산</label><output class="amount" id="amount" for="budget">100,000원</output><p class="hint">희망 예산</p><input id="budget" class="range" type="range" min="30000" max="300000" step="10000" value="100000" aria-label="월 보험료 예산"><div class="limits"><span>3만원</span><span>30만원</span></div></div><button class="primary" data-action="claim">보험금 청구</button><div class="pair"><button class="secondary" data-action="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-6M10 21V9M16 21V3M22 21V7"/></svg>보장분석</button><button class="secondary" data-action="design" aria-controls="budgetPanel" aria-expanded="false">보험설계</button></div><button class="link-record" data-action="connect"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7V4h7l3 3h10v15H2Z"/><path d="M12 11v7M8.5 14.5h7"/></svg><span><b>진료정보 연결</b><small>동의하고 본인인증하기</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button></section><nav class="bottomnav" aria-label="하단 메뉴"><button data-action="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-8 9 8v12h-6v-8H9v8H3Z"/></svg><span>홈</span></button><button data-action="insurance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z"/><path d="m8 11 3 3 5-6"/></svg><span>내 보험</span></button><button data-action="claim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="15" height="20" rx="3"/><path d="M9 7h7M9 11h5"/></svg><span>청구</span></button><button data-action="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 23v-3a9 9 0 0 1 18 0v3"/></svg><span>마이</span></button></nav></main><div id="toast" role="status"></div><script>
const budget=document.querySelector('#budget'),amount=document.querySelector('#amount');function updateBudget(){const value=Number(budget.value);amount.textContent=value.toLocaleString('ko-KR')+'원';budget.setAttribute('aria-valuetext',amount.textContent);const p=(value-30000)/270000*100;budget.style.background='linear-gradient(to right,#0d2c4d '+p+'%,#e0e5eb '+p+'%)'}budget.addEventListener('input',updateBudget);updateBudget();let timer;function notice(message){const t=document.querySelector('#toast');t.textContent=message;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',3500)}const messages={design:'보험 설계 기능은 준비 중입니다.',analysis:'보장분석 기능은 준비 중입니다.',claim:'보험금 청구 기능은 아직 연결되지 않았습니다.',connect:'본인인증 및 진료정보 조회는 아직 연결되지 않았습니다.',insurance:'보험 정보 연결을 준비 중입니다.',my:'마이페이지는 준비 중입니다.'};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='design'){document.querySelector('#budgetPanel').hidden=false;b.setAttribute('aria-expanded','true');budget.focus({preventScroll:true});document.querySelector('#budgetPanel').scrollIntoView({behavior:'smooth',block:'center'});}else if(b.dataset.action==='home'){document.querySelector('#budgetPanel').hidden=true;document.querySelector('[data-action=design]').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'smooth'});}else if(b.dataset.action==='connect'){location.href='https://bubble.local/connect';}else if(b.dataset.action==='my'){location.href='https://bubble.local/records';}else notice(messages[b.dataset.action])});
</script></body></html>
